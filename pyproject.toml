[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obelix"]

[project]
name = "obelix-data"
version = "1.2.0"
dependencies = ["pandas", "pymatgen", "tqdm", "numpy", "openpyxl"]
requires-python = ">=3.8"
maintainers = [
  {name = "Felix Therrien", email = "felix.therrien@gmail.com"}
]
description = "A Curated Dataset of Crystal Structures and Experimentally Measured Ionic Conductivities for Lithium Solid-State Electrolytes"
readme = "README.md"
license = "MIT"
keywords = ["batteries", "solid-state", "dataset", "database", "ionic-conductivity"]

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[project.urls]
Repository = "https://github.com/NRC-Mila/OBELiX"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow -- downloads real data and checks wall-clock time (deselect with '-m \"not slow\"')",
]